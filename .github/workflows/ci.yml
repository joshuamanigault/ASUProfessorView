name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:

permissions:
  contents: read


jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript type checking
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test

  build:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24}
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist-chrome/
            dist-firefox/
          if-no-files-found: error

  validate-extensions:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Download browser builds
        uses: actions/download-artifact@v5
        with:
          name: dist
      - name: Validate extensions
        run: npm run validate:extensions
      - name: Smoke-test production content bundles
        run: npm run smoke:content
      - name: Exercise shipped extension message and data flow
        run: npm run smoke:extension
      - name: Verify release ZIP creation
        run: npm run package:extensions


  validate-firefox:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Download browser builds
        uses: actions/download-artifact@v5
        with:
          name: dist
      - name: Validate Firefox extension
        run: npm run lint:firefox

  ci:
    name: CI gate
    if: ${{ always() }}
    needs: [lint, typecheck, test, build, validate-extensions, validate-firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every production check to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const checks = JSON.parse(process.env.CHECK_RESULTS);
          for (const [name, { result }] of Object.entries(checks)) {
            if (result !== 'success') {
              console.error(`${name}: ${result}`);
              process.exitCode = 1;
            }
          }
          NODE
